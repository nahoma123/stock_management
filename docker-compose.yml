services:
  # Odoo Application Service (for tenants)
  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    container_name: odoo_app
    command: --init base,saas_management_tools
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/database/selector"]
      interval: 10s
      timeout: 5s
      retries: 12

  # PostgreSQL Database Service (used by Odoo and our new backend)
  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # New Go Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: saas_backend_v2
    depends_on:
      db:
        condition: service_healthy
      odoo:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=odoo
      - GIN_MODE=release
    restart: unless-stopped

  # New React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: saas_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  odoo-data:
  postgres-data:
