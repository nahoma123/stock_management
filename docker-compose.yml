services:
  # PostgreSQL Database Service (used by Odoo and our backend)
  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - saas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: saas_backend_v2
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=odoo
      - GIN_MODE=release
      - HOST_PROJECT_PATH=/home/nahom/Desktop/project/odoo_project
      - DOCKER_NETWORK=saas_net
      - CUSTOMIZATION_ADMIN_TOKEN=${CUSTOMIZATION_ADMIN_TOKEN:-}
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tenants:/app/tenants
    restart: unless-stopped
    networks:
      - saas_net

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: saas_frontend
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`superadmin.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - saas_net

  documentation:
    build:
      context: .
      dockerfile: Dockerfile.documentation
    container_name: stock_platform_docs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.documentation.rule=Host(`docs.localhost`)"
      - "traefik.http.services.documentation.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - saas_net
    
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8090"
    ports:
      - "8090:8090"
      - "8091:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - saas_net

networks:
  saas_net:
    name: saas_net
    driver: bridge

volumes:
  postgres-data:
