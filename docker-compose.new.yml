services:
  # Odoo Application Service (for tenants)
  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    container_name: odoo_app
    depends_on:
      - db
    ports:
      - "18069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    restart: unless-stopped

  # PostgreSQL Database Service (used by Odoo and our new backend)
  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # New Go Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.new
    container_name: saas_backend
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
      - GIN_MODE=release
    restart: unless-stopped

  # New React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.new
    container_name: saas_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  odoo-data:
  postgres-data:
